<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A5376"/>
      <stop offset="45%" stop-color="#2A3D58"/>
      <stop offset="100%" stop-color="#1B283A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0E1622" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- 星光点缀 -->
  <g fill="rgba(255,255,255,0.45)">
    <circle cx="130" cy="95" r="2"/>
    <circle cx="280" cy="65" r="1.5"/>
    <circle cx="680" cy="110" r="2"/>
    <circle cx="720" cy="230" r="1.5"/>
    <circle cx="150" cy="320" r="2.2"/>
    <circle cx="640" cy="340" r="1.6"/>
  </g>

  <!-- 飘落的白山茶花瓣 -->
  <g fill="#F2F6FA" opacity="0.65" filter="url(#soft)">
    <path d="M190,140 C205,125 225,135 220,150 C215,165 195,155 190,140 Z" transform="rotate(-15 205 145)"/>
    <path d="M610,180 C625,168 642,176 638,190 C632,202 615,195 610,180 Z" transform="rotate(22 625 185)"/>
    <path d="M230,260 C242,250 258,256 254,268 C250,278 235,272 230,260 Z" transform="rotate(-35 244 264)"/>
  </g>

  <!-- 核心白山茶花朵 -->
  <g transform="translate(400,215)" filter="url(#soft)">
    <!-- 墨绿山茶叶片 -->
    <path d="M-55,-15 C-85,-50 -115,-35 -105,-5 C-95,20 -65,5 -55,-15 Z" fill="#4B6656" opacity="0.9"/>
    <path d="M55,-15 C85,-50 115,-35 105,-5 C95,20 65,5 55,-15 Z" fill="#4B6656" opacity="0.9"/>
    <!-- 外层花瓣 -->
    <circle cx="0" cy="-44" r="36" fill="#EDF3F9" opacity="0.96"/>
    <circle cx="42" cy="-14" r="36" fill="#E6EEF6" opacity="0.96"/>
    <circle cx="26" cy="36" r="36" fill="#EDF3F9" opacity="0.96"/>
    <circle cx="-26" cy="36" r="36" fill="#E6EEF6" opacity="0.96"/>
    <circle cx="-42" cy="-14" r="36" fill="#EDF3F9" opacity="0.96"/>
    <!-- 中层叠瓣 -->
    <circle cx="0" cy="-25" r="26" fill="#F8FAFD"/>
    <circle cx="24" cy="-8" r="26" fill="#FFFFFF"/>
    <circle cx="15" cy="22" r="26" fill="#F8FAFD"/>
    <circle cx="-15" cy="22" r="26" fill="#FFFFFF"/>
    <circle cx="-24" cy="-8" r="26" fill="#F8FAFD"/>
    <!-- 内层卷心与花蕊 -->
    <circle cx="0" cy="0" r="17" fill="#FFFBF0"/>
    <circle cx="-3" cy="-3" r="3.2" fill="#E4AF65"/>
    <circle cx="4" cy="-2" r="3.2" fill="#E4AF65"/>
    <circle cx="0" cy="4" r="3.2" fill="#E4AF65"/>
  </g>

  <!-- 题字与心语 -->
  <text x="400" y="325" text-anchor="middle" fill="#FFFFFF" opacity="0.88" font-family="-apple-system,PingFang SC,sans-serif" font-size="16" font-weight="500" letter-spacing="4">海 盐 · 白 山 茶</text>
  <text x="400" y="350" text-anchor="middle" fill="#FFFFFF" opacity="0.45" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" letter-spacing="2">CAMELLIA &amp; SEA SALT</text>
</svg>
