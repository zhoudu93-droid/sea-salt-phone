<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="山茶信笺">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F4F6F9">
<title>山茶信笺 · Camellia Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=124">
</head>
<body>

    <circle cx="8.6" cy="11.7" r=".95" fill="currentColor" stroke="none"/>
    <circle cx="12" cy="11.7" r=".95" fill="currentColor" stroke="none"/>
    <circle cx="15.4" cy="11.7" r=".95" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-contacts" viewBox="0 0 24 24">
    <circle cx="9" cy="7.6" r="3.2"/>
    <path d="M3.6 19.4c0-3 2.4-5.1 5.4-5.1s5.4 2.1 5.4 5.1"/>
    <path d="M16.6 8.6h4M16.6 12h4M16.6 15.4h2.6"/>
  </symbol>
  <symbol id="i-plane" viewBox="0 0 24 24"><path d="M21.2 3.4 3.6 10.6l5.8 2.9.6 6.7 3-4.4 4.7 3.2 3.5-15.6Z"/><path d="m9.4 13.5 8.4-8.6"/></symbol>
  <symbol id="i-camera-story" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-moments" viewBox="0 0 24 24">
    <rect x="3.4" y="4.6" width="17.2" height="14.8" rx="3"/>
    <circle cx="8.9" cy="9.9" r="1.5"/>
    <path d="M4.2 16.4l4.3-3.9 3.1 2.6 3.4-3.4 4.7 4.5"/>
  </symbol>
  <symbol id="i-discover" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <polygon points="16.2 7.8 13.8 13.8 7.8 16.2 10.2 10.2 16.2 7.8" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
  </symbol>
  <symbol id="i-miniapp" viewBox="0 0 24 24">
    <rect x="3" y="3" width="7" height="7" rx="2"/>
    <rect x="14" y="3" width="7" height="7" rx="2"/>
    <rect x="14" y="14" width="7" height="7" rx="2"/>
    <rect x="3" y="14" width="7" height="7" rx="2"/>
  </symbol>
  <symbol id="i-me" viewBox="0 0 24 24">
    <circle cx="12" cy="8.2" r="3.7"/>
    <path d="M4.8 20.2c0-3.7 3.2-6.3 7.2-6.3s7.2 2.6 7.2 6.3"/>
  </symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.6 5.6 8.2 12l6.4 6.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.4v13.2M5.4 12h13.2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="5.9"/><path d="m15.1 15.1 4.3 4.3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 6.4l11.2 11.2M17.6 6.4 6.4 17.6"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M3.8 8.9A2.3 2.3 0 0 1 6.1 6.6h1.7l1.1-1.9h6.2l1.1 1.9h1.7a2.3 2.3 0 0 1 2.3 2.3v6.6a2.3 2.3 0 0 1-2.3 2.3H6.1a2.3 2.3 0 0 1-2.3-2.3Z"/><circle cx="12" cy="12.1" r="3.3"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3.6 8.4a2.4 2.4 0 0 1 2.4-2.4h11.6a2.4 2.4 0 0 1 2.4 2.4v8a2.4 2.4 0 0 1-2.4 2.4H6a2.4 2.4 0 0 1-2.4-2.4Z"/><path d="M20 10.6h-3.6a1.7 1.7 0 0 0 0 3.4H20"/></symbol>
  <symbol id="i-sticker" viewBox="0 0 24 24"><path d="M20.4 12.4A8.4 8.4 0 1 1 11.6 3.6"/><path d="M20.4 12.4H14a1.6 1.6 0 0 0-1.6 1.6v6.4"/><path d="M20.4 12.4a8.4 8.4 0 0 0-8.8-8.8"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.4 11.9 19.6 4.5l-4.2 15.2-3.5-5.4Z"/><path d="m11.9 14.3 7.7-9.8"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.35" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.8" y="10.4" width="14.4" height="9.2" rx="2.6"/><path d="M8.4 10.4V8a3.6 3.6 0 0 1 7.2 0v2.4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.9"/><path d="M12 3.6v2.2M12 18.2v2.2M20.4 12h-2.2M5.8 12H3.6M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 19.6S4.4 15.3 4.4 10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.6 2.6c0 5.1-7.6 9.4-7.6 9.4Z"/></symbol>
  <symbol id="i-bubble" viewBox="0 0 24 24"><path d="M20 11.8c0 4-3.6 7.2-8 7.2-1 0-2-.16-2.9-.45L5 20.2l1.2-3.3A6.9 6.9 0 0 1 4 11.8C4 7.8 7.6 4.6 12 4.6s8 3.2 8 7.2Z"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3.6" y="5.2" width="16.8" height="13.6" rx="2.8"/><circle cx="9" cy="10.2" r="1.4"/><path d="m4.4 16.6 4.4-4 3 2.6 3.4-3.4 4.6 4.4"/></symbol>
</svg>

<!-- ============ 启动 / 登录注册 ============ -->
<div id="boot" class="boot">
  <div class="boot-inner" style="max-width:390px;padding:10px 0;">
    <div id="boot-body" class="boot-body"></div>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="app" class="app hidden">
  <header class="hdr" id="hdr">
    <button class="hdr-btn" id="hdr-left" aria-label="返回"></button>
    <div class="hdr-title ins-title" id="hdr-title">微信</div>
    <button class="hdr-btn" id="hdr-right" aria-label="更多"></button>
    <div class="hdr-lace" id="hdr-lace"></div>
  </header>

  <main class="views" id="views">
    <section class="view" data-view="chat"></section>
    <section class="view hidden" data-view="contacts"></section>
    <section class="view hidden" data-view="discover"></section>
    <section class="view hidden" data-view="moments"></section>
    <section class="view hidden" data-view="me"></section>
  </main>

  <div class="tabbar-lace"></div>
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="chat"><svg class="ti"><use href="#i-send"></use></svg><span>信笺</span></button>
    <button class="tab" data-tab="contacts"><svg class="ti"><use href="#i-contacts"></use></svg><span>密友</span></button>
    <button class="tab" data-tab="discover"><svg class="ti"><use href="#i-discover"></use></svg><span>瞬息</span></button>
    <button class="tab" data-tab="me"><svg class="ti"><use href="#i-me"></use></svg><span>关于我</span></button>
  </nav>
</div>

<!-- ============ 通用弹层 ============ -->
<div id="sheet-wrap" class="sheet-wrap hidden">
  <div class="sheet-mask" id="sheet-mask"></div>
  <div class="sheet" id="sheet"></div>
</div>
<div id="pane-wrap" class="pane-wrap hidden">
  <div class="pane" id="pane"></div>
</div>
<!-- 独立的二级子页面面板（面具、钱包、收藏等完整单开页面，无下半栏弹窗） -->
<div id="subpane-wrap" class="pane-wrap hidden" style="z-index:60;">
  <div class="pane" id="subpane"></div>
</div>
<div id="toast" class="toast"></div>

<script src="app.js?v=126"></script>
<script src="petals.js?v=2"></script>
</body>
</html>
