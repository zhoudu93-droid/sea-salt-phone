<style>
  /* 内联首屏动画：不依赖外部CSS下载，HTML一到就显示，彻底消灭白屏 */
  #splash {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: linear-gradient(180deg,#FDF6F2 0%, #F6EEF3 55%, #F3E9EE 100%);
  }
  #splash .sp-flower { width: 54px; height: 54px; animation: sp-spin 2.6s linear infinite; }
  @keyframes sp-spin { to { transform: rotate(360deg); } }
  #splash .sp-name { font-size: 15px; font-weight: 600; color: #C58A9E; letter-spacing: .22em; text-indent: .22em; }
  #splash .sp-dots { display: flex; gap: 7px; }
  #splash .sp-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #E8B4C4;
    animation: sp-blink 1.2s ease-in-out infinite;
  }
  #splash .sp-dot:nth-child(2) { animation-delay: .2s; }
  #splash .sp-dot:nth-child(3) { animation-delay: .4s; }
  @keyframes sp-blink { 0%,100% { opacity:.25; transform: scale(.8);} 50% { opacity:1; transform: scale(1.15);} }
  #splash.sp-out { opacity: 0; transition: opacity .45s ease; pointer-events: none; }
</style>

<style>
  /* 首屏加载动画：纯 HTML/CSS，页面一打开立刻显示，盖住 JS 解析期的白屏 */
  #splash {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: linear-gradient(180deg,#FDF6F2 0%, #F6EEF3 55%, #F3E9EE 100%);
  }
  #splash .sp-flower { width: 54px; height: 54px; animation: sp-spin 2.6s linear infinite; }
  @keyframes sp-spin { to { transform: rotate(360deg); } }
  #splash .sp-name {
    font-size: 15px; font-weight: 600; color: #C58A9E; letter-spacing: .22em; text-indent: .22em;
  }
  #splash .sp-dots { display: flex; gap: 7px; }
  #splash .sp-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #E8B4C4;
    animation: sp-blink 1.2s ease-in-out infinite;
  }
  #splash .sp-dot:nth-child(2) { animation-delay: .2s; }
  #splash .sp-dot:nth-child(3) { animation-delay: .4s; }
  @keyframes sp-blink { 0%,100% { opacity:.25; transform: scale(.8);} 50% { opacity:1; transform: scale(1.15);} }
  #splash.sp-out { opacity: 0; transition: opacity .45s ease; pointer-events: none; }
</style>

<!-- 首屏加载动画（JS 就绪后淡出） -->
<div id="splash">

    <circle cx="12" cy="12" r="2.1" fill="#F2C4D2" stroke="none"/>
    <path d="M12 9.9C10.2 8.1 10.4 5.4 12 3.6c1.6 1.8 1.8 4.5 0 6.3Z"/>
    <path d="M12 14.1c1.8 1.8 1.6 4.5 0 6.3-1.6-1.8-1.8-4.5 0-6.3Z"/>
    <path d="M9.9 12C8.1 13.8 5.4 13.6 3.6 12c1.8-1.6 4.5-1.8 6.3 0Z"/>
    <path d="M14.1 12c1.8-1.8 4.5-1.6 6.3 0-1.8 1.6-4.5 1.8-6.3 0Z"/>
    <path d="M10.6 10.6C9.2 8.4 9.6 5.9 11.3 4.3c1.3 2 1.2 4.5-.7 6.3Z" opacity=".6"/>
    <path d="M13.4 13.4c1.4 2.2 1 4.7-.7 6.3-1.3-2-1.2-4.5.7-6.3Z" opacity=".6"/>
    <path d="M10.6 13.4C8.4 14.8 5.9 14.4 4.3 12.7c2-1.3 4.5-1.2 6.3.7Z" opacity=".6"/>
    <path d="M13.4 10.6c2.2-1.4 4.7-1 6.3.7-2 1.3-4.5 1.2-6.3-.7Z" opacity=".6"/>
  </svg>
  <div class="sp-name">山茶信笺</div>
  <div class="sp-dots"><span class="sp-dot"></span><span class="sp-dot"></span><span class="sp-dot"></span></div>
</div>
<script>
  // JS 就绪、主界面渲染后淡出加载层（最迟 2.5s 强制淡出，防卡住）
  (function () {
    var gone = false;
    window.__hideSplash = function () {
      if (gone) return; gone = true;
      var sp = document.getElementById('splash');
      if (!sp) return;
      sp.classList.add('sp-out');
      setTimeout(function () { sp.remove(); }, 500);
    };
    window.addEventListener('load', function () {
      setTimeout(window.__hideSplash, 600);
    });
    setTimeout(window.__hideSplash, 2500);
  })();
</script>

<!-- ============ 主应用 ============ -->
<div id="app" class="app hidden">
  <header class="hdr" id="hdr">
    <button class="hdr-btn" id="hdr-left" aria-label="返回"></button>
    <div class="hdr-title ins-title" id="hdr-title">微信</div>
    <button class="hdr-btn" id="hdr-right" aria-label="更多"></button>
    <div class="hdr-lace" id="hdr-lace"></div>
  </header>

  <main class="views" id="views">
    <section class="view" data-view="chat"></section>
    <section class="view hidden" data-view="contacts"></section>
    <section class="view hidden" data-view="discover"></section>
    <section class="view hidden" data-view="moments"></section>
    <section class="view hidden" data-view="me"></section>
  </main>

  <div class="tabbar-lace"></div>
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="chat"><svg class="ti"><use href="#i-send"></use></svg><span>信笺</span></button>
    <button class="tab" data-tab="contacts"><svg class="ti"><use href="#i-contacts"></use></svg><span>密友</span></button>
    <button class="tab" data-tab="discover"><svg class="ti"><use href="#i-discover"></use></svg><span>瞬息</span></button>
    <button class="tab" data-tab="me"><svg class="ti"><use href="#i-me"></use></svg><span>关于我</span></button>
  </nav>
</div>
