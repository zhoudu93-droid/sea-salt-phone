<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6E9C"/>
      <stop offset="50%" stop-color="#33507A"/>
      <stop offset="100%" stop-color="#223348"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#101824" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#glow)"/>
  <!-- Decorative stars & petals -->
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="120" cy="90" r="2"/>
    <circle cx="260" cy="60" r="1.5"/>
    <circle cx="680" cy="110" r="2.5"/>
    <circle cx="710" cy="240" r="1.5"/>
    <circle cx="160" cy="300" r="2"/>
  </g>
  <!-- Stylized Camellia Flower -->
  <g transform="translate(400,210)" filter="url(#shadow)">
    <!-- Leaves -->
    <path d="M-60,-20 C-90,-60 -120,-40 -110,-10 C-100,20 -70,0 -60,-20 Z" fill="#5F826E" opacity="0.85"/>
    <path d="M60,-20 C90,-60 120,-40 110,-10 C100,20 70,0 60,-20 Z" fill="#5F826E" opacity="0.85"/>
    <!-- Outer Petals -->
    <circle cx="0" cy="-42" r="34" fill="#F4F7FB" opacity="0.95"/>
    <circle cx="40" cy="-14" r="34" fill="#EEF3F8" opacity="0.95"/>
    <circle cx="25" cy="35" r="34" fill="#F4F7FB" opacity="0.95"/>
    <circle cx="-25" cy="35" r="34" fill="#EEF3F8" opacity="0.95"/>
    <circle cx="-40" cy="-14" r="34" fill="#F4F7FB" opacity="0.95"/>
    <!-- Mid Petals -->
    <circle cx="0" cy="-24" r="24" fill="#FFFFFF"/>
    <circle cx="23" cy="-7" r="24" fill="#FFFFFF"/>
    <circle cx="14" cy="20" r="24" fill="#FFFFFF"/>
    <circle cx="-14" cy="20" r="24" fill="#FFFFFF"/>
    <circle cx="-23" cy="-7" r="24" fill="#FFFFFF"/>
    <!-- Inner Heart -->
    <circle cx="0" cy="0" r="16" fill="#FFF8E7"/>
    <circle cx="-3" cy="-3" r="3" fill="#E8B86D"/>
    <circle cx="4" cy="-2" r="3" fill="#E8B86D"/>
    <circle cx="0" cy="4" r="3" fill="#E8B86D"/>
  </g>
  <text x="400" y="320" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-family="-apple-system,PingFang SC,sans-serif" font-size="16" letter-spacing="4">海 盐 · 白 山 茶</text>
  <text x="400" y="344" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="-apple-system,PingFang SC,sans-serif" font-size="10" letter-spacing="2">CAMELLIA &amp; SEA SALT</text>
</svg>